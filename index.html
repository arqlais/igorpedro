<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<title>Primeiro Passo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --navy:#1B3A5C;--blue:#2F5D8A;--sky:#DCE7F3;--mist:#F3F6FA;--gold:#E0A93B;--gold-soft:#FBF1DC;
  --ink:#1E2733;--muted:#5F6B7A;--line:#DCE3EC;--bg:#FFFFFF;--surface:#FFFFFF;--on-navy:#FFFFFF;
  --green:#3E8E5E;--green-soft:#E3F2E8;--red:#C44536;--red-soft:#FBE6E3;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#9CC0E6;--blue:#7FA6CF;--sky:#1F3450;--mist:#16212E;--gold:#F0BE5A;--gold-soft:#3A2F17;
  --ink:#E8EDF3;--muted:#9AA7B6;--line:#2A3746;--bg:#0F1720;--surface:#141E2A;--on-navy:#0F1720;
  --green-soft:#1B3325;--red-soft:#3A1F1C;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#9CC0E6;--blue:#7FA6CF;--sky:#1F3450;--mist:#16212E;--gold:#F0BE5A;--gold-soft:#3A2F17;
  --ink:#E8EDF3;--muted:#9AA7B6;--line:#2A3746;--bg:#0F1720;--surface:#141E2A;--on-navy:#0F1720;--green-soft:#1B3325;--red-soft:#3A1F1C;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);color:var(--navy);margin:0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
img,svg{max-width:100%}
i[data-lucide],svg.lucide{width:20px;height:20px;stroke-width:1.9;flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
[hidden]{display:none!important}

.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;min-height:48px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:var(--on-navy)}
.btn-gold{background:var(--gold);color:#1B3A5C}
.btn-ghost{border:1.5px solid var(--line);background:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

/* ---------- SITE ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--navy);text-decoration:none}
.brand .mk{width:32px;height:32px;border-radius:10px;background:#1B3A5C;display:grid;place-items:center}
.brand .mk svg{width:18px;height:18px;color:#E0A93B}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;padding:8px 12px;border-radius:999px}
.topnav a:hover{background:var(--mist);color:var(--navy)}
.topbar .btn{min-height:42px;padding:9px 18px;font-size:15px}

.hero{padding:64px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.3fr .9fr;gap:48px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--gold-soft);padding:6px 13px;border-radius:999px;font-weight:600;font-size:14px}
.tag svg{width:16px;height:16px;color:var(--gold)}
.hero h1{font-size:clamp(44px,6.6vw,78px);font-weight:800;line-height:.98;letter-spacing:-.03em;margin:20px 0}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .lead{font-size:19px;color:var(--muted);max-width:34ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.hero .assure{display:flex;flex-wrap:wrap;gap:16px;margin-top:22px;color:var(--muted);font-size:14px}
.hero .assure span{display:flex;gap:6px;align-items:center}
.hero .assure svg{width:16px;height:16px;color:var(--green)}

.phone{justify-self:center;width:300px;border-radius:40px;background:#0F1720;padding:12px;box-shadow:0 30px 60px -20px rgba(27,58,92,.45)}
.phone .scr{border-radius:30px;background:#fff;overflow:hidden;color:#1E2733}
.phone .ph{background:#1B3A5C;color:#fff;padding:22px 18px 18px}
.phone .ph small{color:#C9D8EA;font-size:12px}
.phone .ph b{display:block;font-family:var(--display);font-size:22px;margin-top:2px}
.phone .pbar{height:7px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:14px;overflow:hidden}
.phone .pbar i{display:block;height:100%;width:38%;background:#E0A93B;border-radius:99px;animation:grow 1.6s .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.phone .pb{padding:14px;display:grid;gap:10px}
.phone .pc{border:1px solid #DCE3EC;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;font-size:13px}
.phone .pc .ic{width:36px;height:36px;border-radius:11px;background:#FBF1DC;display:grid;place-items:center;color:#1B3A5C}
.phone .pc b{display:block;font-size:14px}
.phone .pc small{color:#5F6B7A}
.phone .pc.done .ic{background:#E3F2E8;color:#3E8E5E}

.sec{padding:72px 0;border-top:1px solid var(--line)}
.sec-h{max-width:620px;margin-bottom:36px}
.sec-h h2{font-size:clamp(30px,4vw,44px);font-weight:800}
.sec-h p{color:var(--muted);font-size:17px;margin-top:10px}
.kicker{color:var(--gold);font-weight:700;font-size:15px;margin-bottom:10px;display:block}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.stp{padding:0 18px 0 0}
.stp .bar{height:10px;border-radius:99px;margin-bottom:20px}
.stp:nth-child(1) .bar{background:#9DB8D4}.stp:nth-child(2) .bar{background:#6F93BA}.stp:nth-child(3) .bar{background:#2F5D8A}.stp:nth-child(4) .bar{background:#1B3A5C}
.stp .n{font-family:var(--display);font-weight:800;font-size:15px;color:var(--gold)}
.stp h3{font-size:22px;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.stp h3 svg{color:var(--blue)}
.stp p{color:var(--muted);font-size:15px}
.stp .when{margin-top:12px;font-size:14px;font-weight:600;color:var(--navy);display:flex;gap:6px}
.stp .when svg{width:16px;height:16px;color:var(--gold);margin-top:3px}

.who{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.who > div{padding:24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:14px}
.who > div:nth-child(3n){border-right:0}.who > div:nth-last-child(-n+3){border-bottom:0}
.who svg{color:var(--blue);width:24px;height:24px}
.who b{display:block;font-size:17px;margin-bottom:2px}
.who p{color:var(--muted);font-size:15px}

.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.plan{border:1.5px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.plan.hl{border-color:var(--navy);box-shadow:0 12px 30px -18px rgba(27,58,92,.5)}
.plan .lv{font-weight:700;font-size:14px;color:var(--gold)}
.plan h3{font-size:22px}
.plan .pr{font-family:var(--display);font-weight:800;font-size:32px;color:var(--navy);line-height:1;margin-top:6px}
.plan .pr small{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted)}
.plan ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;font-size:15px}
.plan li{display:flex;gap:8px}
.plan li svg{width:17px;height:17px;color:var(--green);margin-top:3px}
.note{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:15px;margin-top:18px}
.note svg{color:var(--gold);margin-top:2px}

.faq{display:grid;gap:10px;max-width:820px}
.faq details{border:1px solid var(--line);border-radius:16px;padding:0 20px;background:var(--surface)}
.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{transition:transform .2s;color:var(--blue)}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details p{padding:0 0 18px;color:var(--muted)}

.cta{background:#1B3A5C;color:#fff;border-radius:28px;padding:48px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.cta h2{color:#fff;font-size:clamp(28px,3.6vw,40px)}
.cta p{color:#C9D8EA;margin-top:10px}
.foot{padding:40px 0 56px;color:var(--muted);font-size:14px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
.care{display:flex;gap:10px;align-items:flex-start;max-width:520px}
.care svg{color:var(--red);margin-top:2px}

/* ---------- ONBOARDING ---------- */
.ob{min-height:100vh;display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.ob-top .x{color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--mist)}
.ob-prog{flex:1;height:8px;border-radius:99px;background:var(--mist);overflow:hidden}
.ob-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:99px;transition:width .4s}
.ob-count{font-size:14px;color:var(--muted);font-weight:600;min-width:42px;text-align:right}
.ob-body{flex:1;width:100%;max-width:620px;margin:0 auto;padding:36px 22px 120px}
.ob-body.anim{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ob-body h2{font-size:clamp(28px,5vw,38px);font-weight:800}
.ob-body .sub{color:var(--muted);font-size:17px;margin:10px 0 26px}
.field{display:grid;gap:8px;margin-bottom:18px}
.field label{font-weight:700}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);font-size:17px;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--navy);outline:none}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;background:var(--surface);min-height:58px;transition:border-color .15s,background .15s}
.opt .oi{width:38px;height:38px;border-radius:12px;background:var(--mist);display:grid;place-items:center;color:var(--blue);flex:none}
.opt b{display:block;font-size:16px}
.opt small{color:var(--muted);font-size:14px}
.opt .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.opt .ck svg{width:14px;height:14px;opacity:0}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--mist)}
.opt[aria-pressed="true"] .ck{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.opt[aria-pressed="true"] .ck svg{opacity:1}
.parq{display:grid;gap:10px}
.pq{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.pq p{font-weight:600}
.yn{display:flex;gap:8px}
.yn button{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-weight:700;min-height:44px}
.yn button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.alert{display:flex;gap:12px;border-radius:16px;padding:14px 16px;margin-top:16px;font-size:15px}
.alert svg{margin-top:2px}
.alert.warn{background:var(--gold-soft)} .alert.warn svg{color:var(--gold)}
.alert.ok{background:var(--green-soft)} .alert.ok svg{color:var(--green)}
.ob-foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.ob-foot .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.ob-foot .btn-primary{flex:1}
.result{border:1.5px solid var(--navy);border-radius:22px;overflow:hidden;margin-top:8px}
.result .rh{background:#1B3A5C;color:#fff;padding:22px}
.result .rh small{color:#C9D8EA}
.result .rh b{display:block;font-family:var(--display);font-size:26px;margin-top:4px}
.result .rb{padding:18px 22px;display:grid;gap:12px}
.result .rr{display:flex;gap:12px}
.result .rr svg{color:var(--gold);margin-top:2px}

/* ---------- APP ---------- */
.app{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.app-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.app-top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px;height:62px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1B3A5C;display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.app-top .icon-btn{margin-left:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--mist);position:relative}
.dotb{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--mist)}
.view{max-width:760px;margin:0 auto;padding:22px 20px;animation:fade .3s ease}
.hello{margin-bottom:18px}
.hello small{color:var(--muted);font-weight:600}
.hello h2{font-size:30px;font-weight:800;margin-top:2px}
.lvcard{background:#1B3A5C;color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden}
.lvcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lvcard small{color:#C9D8EA;font-weight:600}
.lvcard h3{color:#fff;font-size:26px;margin-top:2px}
.lvcard .badge{background:#E0A93B;color:#1B3A5C;border-radius:14px;width:52px;height:52px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;flex:none}
.lvsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 8px}
.lvsteps i{height:8px;border-radius:99px;background:rgba(255,255,255,.18)}
.lvsteps i.on{background:#E0A93B}
.lvsteps i.cur{background:linear-gradient(90deg,#E0A93B var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
.lvcard .meta{display:flex;justify-content:space-between;font-size:13px;color:#C9D8EA}
.block{margin-top:24px}
.block-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.block-h h3{font-size:20px}
.block-h a,.link{color:var(--blue);font-weight:700;font-size:14px;text-decoration:none}
.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:18px;padding:14px;background:var(--surface);text-align:left;width:100%}
.task .ti{width:42px;height:42px;border-radius:13px;background:var(--gold-soft);display:grid;place-items:center;color:var(--navy);flex:none}
.task b{display:block}
.task small{color:var(--muted);font-size:14px}
.task .go{margin-left:auto;color:var(--muted)}
.task.done{background:var(--mist)}
.task.done .ti{background:var(--green-soft);color:var(--green)}
.task.done b{text-decoration:line-through;text-decoration-color:var(--muted)}
.next{margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1.5px solid var(--line);border-radius:18px;padding:14px}
.stat b{font-family:var(--display);font-size:28px;color:var(--navy);display:block;line-height:1.1}
.stat small{color:var(--muted);font-size:13px}
.wk{display:grid;gap:10px}
.wcard{border:1.5px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);text-align:left;width:100%}
.wcard .th{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#2F5D8A,#1B3A5C);display:grid;place-items:center;color:#E0A93B}
.wcard .th svg{width:26px;height:26px}
.wcard b{display:block;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;background:var(--mist);border-radius:99px;padding:3px 9px;color:var(--muted)}
.chip svg{width:13px;height:13px}
.chip.ok{background:var(--green-soft);color:var(--green)}
.locked{opacity:.55}
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.player .ph{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.player .pbody{flex:1;overflow:auto;max-width:620px;width:100%;margin:0 auto;padding:22px 20px}
.video{aspect-ratio:16/9;border-radius:20px;background:linear-gradient(135deg,#2F5D8A,#1B3A5C);display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.video svg{width:44px;height:44px;color:#E0A93B}
.video small{display:block;color:#C9D8EA;margin-top:6px}
.timer{font-family:var(--display);font-weight:800;font-size:64px;color:var(--navy);text-align:center;margin:18px 0 4px;font-variant-numeric:tabular-nums}
.exname{text-align:center;font-weight:700;font-size:19px}
.exhint{text-align:center;color:var(--muted);font-size:15px;margin-top:4px}
.exlist{margin-top:20px;display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);font-size:15px}
.ex.cur{border-color:var(--navy);background:var(--mist);font-weight:700}
.ex.ok{color:var(--muted);text-decoration:line-through}
.ex .t{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}
.player .pfoot{border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.player .pfoot .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.player .pfoot .btn{flex:1}
.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.feel button{border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;display:grid;gap:4px;justify-items:center;font-size:13px;font-weight:600}
.feel button[aria-pressed="true"]{border-color:var(--navy);background:var(--mist)}

.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:64px;border:1.5px solid var(--line);border-radius:16px;padding:10px 0;display:grid;justify-items:center;gap:2px}
.day small{font-size:12px;color:var(--muted);font-weight:600}
.day b{font-family:var(--display);font-size:22px}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.slot{border:1.5px solid var(--line);border-radius:12px;padding:11px 0;font-weight:700;min-height:44px}
.slot[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--mist);padding:5px;border-radius:16px}
.seg button{border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px;display:grid;justify-items:center;gap:3px;min-height:56px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.08);color:var(--navy)}
.booking{border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.booking .d{width:52px;height:56px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;text-align:center;line-height:1.1;flex:none}
.booking .d b{font-family:var(--display);font-size:20px;color:var(--navy)}
.booking .d small{font-size:11px;font-weight:700;color:var(--muted);text-transform:lowercase}
.booking .x{margin-left:auto;color:var(--muted);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}

.chat{display:flex;flex-direction:column;height:calc(100vh - 62px - 84px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 0 14px;border-bottom:1px solid var(--line)}
.chat-h .avatar{background:var(--navy);color:var(--on-navy)}
.chat-h small{color:var(--green);font-weight:600;font-size:13px}
.msgs{flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15.5px}
.msg.them{background:var(--mist);border-bottom-left-radius:6px}
.msg.me{background:var(--navy);color:var(--on-navy);margin-left:auto;border-bottom-right-radius:6px}
.msg time{display:block;font-size:11px;opacity:.65;margin-top:3px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1.5px solid var(--line);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600}
.composer{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;background:var(--surface)}
.composer button{width:48px;height:48px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center}

.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{border:1.5px solid var(--line);border-radius:18px;padding:14px 8px;display:grid;justify-items:center;gap:6px;text-align:center;font-size:13px;font-weight:600}
.bdg .bi{width:48px;height:48px;border-radius:50%;background:var(--mist);display:grid;place-items:center;color:var(--muted)}
.bdg.on .bi{background:#E0A93B;color:#1B3A5C}
.bdg:not(.on){opacity:.55}
.plist{border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.plist div{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px}
.plist div:last-child{border-bottom:0}
.plist span{color:var(--muted)}
.plist b{text-align:right}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:grid;justify-items:center;gap:3px;padding:10px 0 12px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;position:relative}
.tabbar a.on{color:var(--navy)}
.tabbar a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tabbar svg{width:23px;height:23px}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1E2733;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;transition:.3s;z-index:90;display:flex;gap:8px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast svg{color:#E0A93B}
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,32,.55);display:grid;place-items:end center;padding:0}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s ease;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .big{width:84px;height:84px;border-radius:24px;background:#E0A93B;color:#1B3A5C;display:grid;place-items:center;margin:0 auto 14px}
.sheet .big svg{width:42px;height:42px}
.sheet h3{font-size:26px}
.sheet p{color:var(--muted);margin:8px 0 18px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.demo{margin-top:26px;border:1.5px dashed var(--line);border-radius:18px;padding:14px 16px;font-size:14px;color:var(--muted);display:grid;gap:10px}
.demo b{color:var(--ink)}
.demo .row{display:flex;flex-wrap:wrap;gap:8px}
.demo button{border:1.5px solid var(--line);border-radius:99px;padding:7px 12px;font-weight:600;font-size:13px}

/* ---------- NOVO: tema, menu, seções ---------- */
.rbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--navy);flex:none}
.rbtn svg{width:19px;height:19px}
.menu-btn{display:none}
.mnav{border-top:1px solid var(--line);padding:8px 0 14px}
.mnav a{display:block;padding:12px 4px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.mnav a:last-child{border-bottom:0}
.promises{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 32px}
.promises > div{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.promises .pi{grid-row:span 2;width:44px;height:44px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;color:var(--navy)}
.promises b{font-size:17px;align-self:end}
.promises p{color:var(--muted);font-size:15px}
.coach{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--mist);border-radius:28px;padding:32px}
.coach .ph{width:120px;height:120px;border-radius:32px;background:#1B3A5C;color:#E0A93B;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px}
.coach h3{font-size:28px}
.coach .cref{color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.coach blockquote{margin:14px 0 0;font-size:18px;line-height:1.5;max-width:58ch}
.coach .chips{margin-top:14px}

/* check-in de humor */
.mood{border:1.5px solid var(--line);border-radius:22px;padding:18px;background:var(--surface)}
.mood h3{font-size:19px}
.mood .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mood .row button{border:1.5px solid var(--line);border-radius:14px;padding:12px 4px;display:grid;justify-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.mood .row button svg{width:24px;height:24px;color:var(--blue)}
.mood .row button[aria-pressed="true"]{border-color:var(--navy);background:var(--mist);color:var(--navy)}
.mood .ans{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:12px}
.mood .ans p{font-size:15.5px}
.mood .ans .btn{justify-self:start;min-height:44px;padding:10px 18px;font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.week i{width:100%;max-width:40px;aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center}
.week i.on{background:var(--green-soft);border:1.5px solid transparent;color:var(--green)}
.week i.today{border-color:var(--navy);border-style:solid}
.week i svg{width:16px;height:16px}
.week-note{color:var(--muted);font-size:14px;margin-top:10px}

/* respiração guiada */
.breath-stage{display:grid;place-items:center;padding:30px 0 10px}
.bcircle{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;position:relative}
.bcircle::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--gold-soft) 0%,var(--sky) 70%);transform:scale(var(--s,.55));transition:transform var(--d,4s) ease-in-out}
.bcircle span{position:relative;font-family:var(--display);font-weight:800;font-size:26px;color:var(--navy)}
.bcount{text-align:center;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.bpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.bpick button{border:1.5px solid var(--line);border-radius:14px;padding:10px;font-weight:700;min-height:48px}
.bpick button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}

/* player: anel e descanso */
.ring{position:relative;width:200px;height:200px;margin:18px auto 6px}
.ring svg{width:200px;height:200px;max-width:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--mist)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring.rest .fg{stroke:var(--green)}
.ring .timer{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:52px}
.ptrack{height:4px;background:var(--mist)}
.ptrack i{display:block;height:100%;background:var(--gold);transition:width .3s}
.restnote{text-align:center;font-weight:700;color:var(--green);font-size:15px}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.filters button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:20px;color:var(--muted);text-align:center}
.hist{border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.hist div{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.hist div:last-child{border-bottom:0}
.hist svg{color:var(--blue)}
.hist small{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.toggle-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;width:100%;text-align:left;background:var(--surface)}
.toggle-row .sw{margin-left:auto;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle-row .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-row[aria-checked="true"] .sw{background:var(--green)}
.toggle-row[aria-checked="true"] .sw::after{transform:translateX(18px)}
.sheet .acts{display:grid;gap:10px}
.btn-danger{background:var(--red);color:#fff}

/* ---------- SITE: faixa de números, formulários, rodapé ---------- */
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}
.facts div{padding:22px 20px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--display);font-weight:800;font-size:34px;color:var(--navy);line-height:1}
.facts span{color:var(--muted);font-size:14.5px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.split ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.split li{display:flex;gap:10px}
.split li svg{color:var(--green);margin-top:2px}
.form{border:1.5px solid var(--line);border-radius:24px;padding:24px;background:var(--surface);display:grid;gap:4px}
.form h3{font-size:22px;margin-bottom:10px}
.form .field{margin-bottom:12px}
.form .field input,.form .field textarea,.form .field select{font-size:16px;padding:12px 14px}
.form textarea{min-height:96px;resize:vertical}
.form .fine{color:var(--muted);font-size:13px;margin-top:8px}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.foot-links a{color:var(--blue);font-weight:600;text-decoration:none}

/* ---------- ENTRAR ---------- */
.login-main{max-width:1000px;margin:0 auto;padding:48px 22px 70px}
.login-main h1{font-size:clamp(34px,5vw,52px);font-weight:800}
.login-main > p{color:var(--muted);font-size:18px;margin-top:10px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.role{border:1.5px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.role .ri{width:52px;height:52px;border-radius:16px;background:var(--gold-soft);color:var(--navy);display:grid;place-items:center}
.role .ri svg{width:26px;height:26px}
.role h2{font-size:24px}
.role p{color:var(--muted);font-size:15px;flex:1}
.role select{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);width:100%}
.role .btn{width:100%}

/* ---------- PAINÉIS ---------- */
.pn{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.pn-side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--mist);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.pn-side .brand{padding:0 6px 4px}
.pn-role{display:inline-flex;align-self:flex-start;margin:6px 6px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.pn-side .nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-decoration:none;font-size:15px}
.pn-side .nv:hover{color:var(--navy)}
.pn-side .nv.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(15,23,32,.08)}
.pn-side .nv .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;font-weight:700}
.pn-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.pn-me b{display:block;font-size:14px;line-height:1.2}
.pn-me small{color:var(--muted);font-size:12.5px}
.pn-me .rbtn{margin-left:auto;width:36px;height:36px}
.pn-main{padding:28px 34px 70px;min-width:0}
.pn-mtop{display:none}
.pn-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pn-head small{color:var(--muted);font-weight:600}
.pn-head h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;margin-top:2px}
.pn-head .acts{display:flex;gap:8px;align-items:center}
.pn-tabbar{display:none}
.btn-sm{min-height:38px;padding:8px 14px;font-size:14px}
.btn-sm svg{width:16px;height:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;background:var(--surface)}
.kpi small{color:var(--muted);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.kpi small svg{width:16px;height:16px;color:var(--blue)}
.kpi b{display:block;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:clamp(22px,2.3vw,28px);color:var(--navy);line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.grid2 > *{min-width:0}
.card{border:1.5px solid var(--line);border-radius:20px;padding:18px;background:var(--surface);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:18px}
.card-h a,.card-h button.link{color:var(--blue);font-weight:700;font-size:14px;text-decoration:none}
.mt{margin-top:14px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--gold-soft);color:#8A6212}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--sky);color:var(--navy)}
.pill.mute{background:var(--mist);color:var(--muted)}
:root[data-theme="dark"] .pill.warn{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.warn{color:var(--gold)}}
.lv{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--navy);color:var(--on-navy);font-family:var(--display);font-weight:800;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;font-family:var(--display)}
.av.me{background:var(--gold);color:#1B3A5C}

.rows{display:grid}
.rw{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;color:inherit;text-decoration:none}
.rw:last-child{border-bottom:0}
.rw b{display:block;font-size:15px;line-height:1.25}
.rw small{color:var(--muted);font-size:13px}
.rw .end{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rw .time{font-family:var(--display);font-weight:800;color:var(--navy);min-width:52px;font-variant-numeric:tabular-nums}
.empty-s{color:var(--muted);font-size:14.5px;padding:10px 0}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:15px;min-height:42px}
.toolbar input{flex:1;min-width:180px}
.tbl{overflow-x:auto;border:1.5px solid var(--line);border-radius:18px;background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:680px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--mist)}
.tbl .nm{display:flex;align-items:center;gap:10px}
.tbl .nm b{white-space:nowrap}
.tbl .num{text-align:right}
.prog{height:7px;border-radius:99px;background:var(--mist);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* gráficos */
.chart svg{width:100%;height:auto;display:block;max-width:100%}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--body)}
.chart .vl{fill:var(--ink);font-size:12.5px;font-weight:700;font-family:var(--body)}
.chart .bar{fill:var(--blue)}
.chart .hit{fill:transparent}
.chart g:hover .bar{fill:var(--navy)}
.hb{display:grid;gap:10px}
.hb div{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.hb span{color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb i{display:block;height:14px;border-radius:0 4px 4px 0;background:var(--blue);min-width:2px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}

/* ================== ONBOARDING ================== */
let OB={step:0,name:"",goals:[],barriers:[],days:[],period:"",contact:"",parq:Array(PARQ.length).fill(null),notes:""};
const OB_STEPS=["nome","objetivo","barreiras","rotina","contato","saude","resultado"];
function onboarding(){
  const st=OB_STEPS[OB.step], total=OB_STEPS.length-1;
  let body="",canNext=true,nextLabel="Continuar";
  const optBtns=(list,sel,key,multi)=>list.map(([t,ic,sub])=>`<button class="opt" aria-pressed="${sel.includes(t)}" data-k="${key}" data-v="${esc(t)}" data-m="${multi?1:0}"><span class="oi"><i data-lucide="${ic}"></i></span><span><b>${t}</b>${sub?`<small>${sub}</small>`:""}</span><span class="ck"><i data-lucide="check"></i></span></button>`).join("");
  if(st==="nome"){body=`<h2>Oi! Como você gostaria de ser chamado?</h2><p class="sub">Pode ser seu nome ou apelido. Não precisa de mais nada agora.</p>
    <div class="field"><label for="nm">Seu nome</label><input id="nm" autocomplete="given-name" value="${esc(OB.name)}" placeholder="Ex.: Ana"></div>
    <div class="alert ok"><i data-lucide="lock"></i><span>Suas respostas ficam só entre você e o seu personal.</span></div>`;canNext=OB.name.trim().length>1}
  if(st==="objetivo"){body=`<h2>O que você gostaria de conquistar?</h2><p class="sub">Escolha quantas quiser.</p><div class="opts two">${optBtns(GOALS,OB.goals,"goals",1)}</div>`;canNext=OB.goals.length>0}
  if(st==="barreiras"){body=`<h2>O que mais te impede de começar?</h2><p class="sub">Não existe resposta errada. Isso ajuda o personal a entender você.</p><div class="opts two">${optBtns(BARRIERS,OB.barriers,"barriers",1)}</div>`;canNext=OB.barriers.length>0}
  if(st==="rotina"){const D=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];body=`<h2>Como é sua rotina?</h2><p class="sub">Quais dias você teria uns minutinhos livres?</p>
    <div class="days" role="group" aria-label="Dias">${D.map(d=>`<button class="day" aria-pressed="${OB.days.includes(d)}" data-day="${d}"><small>dia</small><b>${d}</b></button>`).join("")}</div>
    <p style="font-weight:700;margin:22px 0 10px">Melhor período</p>
    <div class="opts">${optBtns([["Manhã","sunrise"],["Tarde","sun"],["Noite","moon"]],[OB.period],"period",0)}</div>`;canNext=OB.days.length>0&&!!OB.period}
  if(st==="contato"){body=`<h2>Como você prefere conversar com o personal?</h2><p class="sub">Você pode mudar isso quando quiser.</p><div class="opts">${optBtns(CONTACT,[OB.contact],"contact",0)}</div>`;canNext=!!OB.contact}
  if(st==="saude"){const any=OB.parq.some(x=>x===true);body=`<h2>Algumas perguntas sobre sua saúde</h2><p class="sub">É o questionário PAR-Q, usado por profissionais de educação física antes de qualquer treino.</p>
    <div class="parq">${PARQ.map((q,i)=>`<div class="pq"><p>${i+1}. ${q}</p><div class="yn"><button data-pq="${i}" data-a="1" aria-pressed="${OB.parq[i]===true}">Sim</button><button data-pq="${i}" data-a="0" aria-pressed="${OB.parq[i]===false}">Não</button></div></div>`).join("")}</div>
    ${any?`<div class="alert warn"><i data-lucide="stethoscope"></i><span>Tudo bem! Você pode continuar. Antes dos treinos, o personal vai pedir uma liberação do seu médico, para você treinar com segurança.</span></div>`:""}`;
    canNext=OB.parq.every(x=>x!==null);nextLabel="Ver meu plano"}
  if(st==="resultado"){const any=OB.parq.some(x=>x===true);body=`<h2>Pronto, ${esc(OB.name.split(" ")[0])}! Seu caminho começa aqui.</h2><p class="sub">Com base nas suas respostas, preparamos seu começo.</p>
    <div class="result"><div class="rh"><small>Você começa no</small><b>Nível 1 · Conhecer</b></div><div class="rb">
      <div class="rr"><i data-lucide="user-round-check"></i><span>Personal sugerida: <b>${PERSONAL.name}</b>, ${PERSONAL.bio.toLowerCase()}</span></div>
      <div class="rr"><i data-lucide="${OB.contact==="Só mensagem"?"message-square":OB.contact==="Áudio"?"mic":"video"}"></i><span>Primeira conversa por <b>${OB.contact.toLowerCase()}</b>, de 15 minutos e gratuita.</span></div>
      <div class="rr"><i data-lucide="calendar"></i><span>Disponível: <b>${OB.days.join(", ")}</b>, de ${OB.period.toLowerCase()}.</span></div>
      ${any?`<div class="rr"><i data-lucide="stethoscope"></i><span>Antes dos treinos, vamos pedir a <b>liberação do seu médico</b>.</span></div>`:""}
    </div></div>`;nextLabel="Entrar no meu app"}
  $("#root").innerHTML=`<div class="ob">
    <div class="ob-top"><a class="x" href="#/" aria-label="Sair"><i data-lucide="x"></i></a><div class="ob-prog"><i style="width:${Math.round(OB.step/total*100)}%"></i></div><span class="ob-count">${Math.min(OB.step+1,total)}/${total}</span></div>
    <div class="ob-body ${OB._last!==OB.step?"anim":""}">${body}</div>
    <div class="ob-foot"><div class="in">${OB.step>0?`<button class="btn btn-ghost" id="back" aria-label="Voltar"><i data-lucide="arrow-left"></i></button>`:""}<button class="btn btn-primary" id="next" ${canNext?"":"disabled"}>${nextLabel}<i data-lucide="arrow-right"></i></button></div></div>
  </div>`;
  OB._last=OB.step;
  const nm=$("#nm");if(nm){nm.focus();nm.oninput=()=>{OB.name=nm.value;$("#next").disabled=OB.name.trim().length<2};nm.onkeydown=e=>{if(e.key==="Enter"&&OB.name.trim().length>1)next()}}
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;if(b.dataset.m==="1"){OB[k]=OB[k].includes(v)?OB[k].filter(x=>x!==v):[...OB[k],v]}else OB[k]=v;onboarding()});
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{const d=b.dataset.day;OB.days=OB.days.includes(d)?OB.days.filter(x=>x!==d):[...OB.days,d];onboarding()});
  document.querySelectorAll("[data-pq]").forEach(b=>b.onclick=()=>{OB.parq[+b.dataset.pq]=b.dataset.a==="1";const y=scrollY;onboarding();scrollTo(0,y)});
  const bk=$("#back");if(bk)bk.onclick=()=>{OB.step--;onboarding();scrollTo(0,0)};
  $("#next").onclick=next;icons();
  function next(){if(OB.step<OB_STEPS.length-1){OB.step++;onboarding();scrollTo(0,0);return}
    S=fresh();S.profile={name:OB.name.trim(),goals:OB.goals,barriers:OB.barriers,days:OB.days,period:OB.period,contact:OB.contact,medical:OB.parq.some(x=>x===true),since:Date.now()};
    S.messages=[{from:"them",text:`Oi, ${OB.name.trim().split(" ")[0]}! Eu sou a ${PERSONAL.name.split(" ")[0]}, sua personal. Li suas respostas e fico feliz que você esteja aqui. 💛`,t:nowT()},{from:"them",text:"Quando quiser, agende nossa primeira conversa na aba Agenda. Pode ser só por mensagem, sem pressa nenhuma.",t:nowT()}];
    S.unread=2;save();OB.step=0;location.hash="#/app";setTimeout(()=>{confetti();toast("Conquista: Primeiro passo!")},300)}
}

function moodBox(){
  const m=S.mood&&S.mood.d===today()?S.mood.v:null;
  let ans="";
  if(m){const w2=S.level>=2,light=WORKOUTS.find(w=>w.id==="w4"),nx=criteria().find(x=>!x.d);

    if(m==="Ansioso")ans=`<p>Vamos desacelerar juntos. Soltar o ar mais devagar do que puxa ajuda o corpo a sair do modo alerta.</p>${br}`;
    if(m==="Mais ou menos")ans=w2?`<p>Um treino curto e tranquilo pode ajudar a virar o dia. Sugestão: <b>${light.t}</b>, ${light.min} min, dá para fazer sentado.</p><button class="btn btn-primary" data-w="${light.id}"><i data-lucide="play"></i>Começar ${light.t.toLowerCase()}</button>`:`<p>Sem problema. Que tal mandar uma mensagem para a ${PERSONAL.name.split(" ")[0]} contando como está? Ela responde sem pressa.</p><a class="btn btn-primary" href="#/app/mensagens"><i data-lucide="message-circle"></i>Mandar mensagem</a>`;

function weekStrip(){

/* respiração guiada */
const BREATH={"4-6":[4,0,6],"4-4-4":[4,4,4],"4-7-8":[4,7,8]};
let B=null;
function breathe(){
  if(B)return;B={pat:"4-6",run:false,left:120,t:null,phase:0,pt:0};
  const el=document.createElement("div");el.className="player";el.id="breath";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Respiração guiada");document.body.appendChild(el);document.body.style.overflow="hidden";renderB();
}
function renderB(){
  const el=$("#breath");const mm=Math.floor(B.left/60),ss=String(B.left%60).padStart(2,"0");

  <div class="pbody"><div class="breath-stage"><div class="bcircle" id="bc"><span id="bl" aria-live="polite">${B.run?"":"Pronto?"}</span></div></div>
    <p class="bcount" id="bt">${mm}:${ss} restantes</p>
    ${B.run?"":`<p class="exhint" style="margin-top:14px">Acompanhe o círculo: ele cresce quando você puxa o ar e diminui quando solta. Se ficar desconfortável, volte a respirar normalmente.</p>
    <div class="bpick" role="group" aria-label="Ritmo">${Object.keys(BREATH).map(k=>`<button aria-pressed="${B.pat===k}" data-bp="${k}">${k}</button>`).join("")}</div>
    <p class="exhint" style="margin-top:8px">${B.pat==="4-6"?"Puxa em 4, solta em 6. O mais simples para acalmar.":B.pat==="4-4-4"?"Puxa em 4, segura 4, solta em 4.":"Puxa em 4, segura 7, solta em 8. Bom para antes de dormir."}</p>`}</div>
  <div class="pfoot"><div class="in"><button class="btn btn-primary" id="bgo"><i data-lucide="${B.run?"square":"play"}"></i>${B.run?"Encerrar":"Começar"}</button></div></div>`;
  icons();
  $("#bclose").onclick=()=>closeB(false);

  $("#bgo").onclick=()=>{if(B.run){closeB(B.left<=90);return}B.run=true;wake(true);renderB();B.phase=-1;B.pt=0;stepB();B.t=setInterval(tickB,1000)};
}
function stepB(){
  const seq=BREATH[B.pat];do{B.phase=(B.phase+1)%3}while(!seq[B.phase]);B.pt=seq[B.phase];
  const c=$("#bc"),l=$("#bl");if(!c)return;

}
function tickB(){B.left--;B.pt--;const t=$("#bt");if(t)t.textContent=Math.floor(B.left/60)+":"+String(B.left%60).padStart(2,"0")+" restantes";if(B.left<=0){closeB(true);return}if(B.pt<=0)stepB()}
function closeB(done){if(!B)return;clearInterval(B.t);wake(false);const el=$("#breath");if(el)el.remove();document.body.style.overflow="";B=null;
  if(done){S.breaths=S.breaths||[];S.breaths.push(Date.now());save();toast("Respiração registrada. Isso também conta!")}route(true)}
function greet(){const h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"}
function suggest(){const done=S.workouts.map(w=>w.id);return WORKOUTS.find(w=>!done.includes(w.id))||WORKOUTS[S.workouts.length%WORKOUTS.length]}
function levelUp(){

function sheet(ic,t,p,btn,opt={}){const prev=document.activeElement;const m=document.createElement("div");m.className="modal";

  $("#sh-ok").onclick=()=>close(true);const no=$("#sh-no");if(no)no.onclick=()=>close(false);
  m.onclick=e=>{if(e.target===m)close(false)};$("#sh-ok").focus()}

/* workout player */
let P=null;
const REST=10,RC=2*Math.PI*90;
function player(w){
  P={w,i:0,left:w.ex[0][1],rest:false,run:false,int:null,feel:null,finished:false,started:false};
  const el=document.createElement("div");el.className="player";el.id="player";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label",w.t);document.body.appendChild(el);document.body.style.overflow="hidden";renderP();
}
const fmt=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
function ringOff(){const tot=P.rest?REST:P.w.ex[P.i][1];return RC*(1-P.left/tot)}
function renderP(){
  const el=$("#player"),w=P.w;
  if(P.finished){wake(false);el.innerHTML=`<div class="ph"><b>${w.t}</b></div><div class="pbody" style="text-align:center">
    <div class="sheet" style="animation:none;padding:10px 0;background:none"><div class="big"><i data-lucide="flame"></i></div><h3>Treino concluído!</h3><p>Cada treino conta. Como você se sentiu?</p></div>
    <div class="feel">${[["Leve","smile"],["Bom","thumbs-up"],["Cansativo","wind"],["Difícil","frown"]].map(([t,ic])=>`<button aria-pressed="${P.feel===t}" data-f="${t}"><i data-lucide="${ic}"></i>${t}</button>`).join("")}</div></div>
    <div class="pfoot"><div class="in"><button class="btn btn-primary" id="pdone" ${P.feel?"":"disabled"}>Salvar e voltar</button></div></div>`;
    el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{P.feel=b.dataset.f;renderP()});
    $("#pdone").onclick=()=>{S.workouts.push({id:w.id,at:Date.now(),feel:P.feel});const n=S.workouts.length;
      const resp=P.feel==="Difícil"?"Obrigada por me contar. Vou deixar o próximo treino mais leve para você. 💛":P.feel==="Cansativo"?"Cansar é normal no começo! Descansa bem hoje.":"Que ótimo! Você está indo muito bem.";
      S.messages.push({from:"me",text:`Terminei o treino "${w.t}" e achei ${P.feel.toLowerCase()}.`,t:nowT()},{from:"them",text:resp,t:nowT()});S.unread++;save();closeP();
      if(n===1)setTimeout(()=>{confetti();toast("Conquista: 1º treino!")},200);else if(n===8)setTimeout(()=>{confetti();toast("Conquista: 8 treinos!")},200);else toast("Treino salvo!")};
    icons();return}
  const [name,sec,hint]=w.ex[P.i];const nxt=w.ex[P.i+1];
  const prog=Math.round((P.i+(P.rest?1:1-P.left/sec))/w.ex.length*100);
  el.innerHTML=`<div class="ph"><button class="rbtn" id="pclose" aria-label="Fechar"><i data-lucide="x"></i></button><div style="flex:1"><b>${w.t}</b><div style="font-size:13px;color:var(--muted)">Exercício ${P.i+1} de ${w.ex.length}</div></div><button class="rbtn" id="psnd" aria-label="${S.sound?"Desligar":"Ligar"} aviso sonoro" aria-pressed="${S.sound}"><i data-lucide="${S.sound?"volume-2":"volume-x"}"></i></button></div>
  <div class="ptrack"><i id="ptr" style="width:${prog}%"></i></div>
  <div class="pbody">${P.rest?"":`<div class="video"><div><i data-lucide="circle-play"></i><div style="font-weight:700;margin-top:8px">${name}</div><small>Vídeo demonstrativo gravado pelo personal</small></div></div>`}
    <div class="ring ${P.rest?"rest":""}"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="bg" cx="100" cy="100" r="90"/><circle class="fg" id="rfg" cx="100" cy="100" r="90" stroke-dasharray="${RC}" stroke-dashoffset="${ringOff()}"/></svg><div class="timer" id="ptm">${fmt(P.left)}</div></div>
    ${P.rest?`<p class="restnote">Descanse. A seguir:</p><div class="exname">${nxt[0]}</div><p class="exhint">${nxt[2]}</p>`:`<div class="exname">${name}</div><p class="exhint">${hint}</p>`}
    <div class="exlist">${w.ex.map((e,i)=>`<div class="ex ${i===P.i&&!P.rest?"cur":i<P.i||(i===P.i&&P.rest)?"ok":""}"><i data-lucide="${i<P.i||(i===P.i&&P.rest)?"check":i===P.i?"play":"circle"}"></i>${e[0]}<span class="t">${e[1]<60?e[1]+" s":Math.round(e[1]/60*10)/10+" min"}</span></div>`).join("")}</div>
    <p class="note"><i data-lucide="heart-pulse"></i>Sentiu dor, tontura ou falta de ar? Pare e avise sua personal.</p></div>
  <div class="pfoot"><div class="in"><button class="btn btn-ghost" id="pskip">${P.rest?"Pular descanso":"Próximo"}</button><button class="btn btn-primary" id="pplay"><i data-lucide="${P.run?"pause":"play"}"></i>${P.run?"Pausar":P.started?"Continuar":"Começar"}</button></div></div>`;
  $("#pclose").onclick=closeP;$("#pskip").onclick=()=>advance(true);
  $("#psnd").onclick=()=>{S.sound=!S.sound;save();renderP()};
  $("#pplay").onclick=()=>{P.run=!P.run;P.started=true;clearInterval(P.int);if(P.run){beep(880);wake(true);P.int=setInterval(tick,1000)}else wake(false);renderP()};
  icons();
}
function tick(){P.left--;if(P.left<=0){advance(false);return}
  if(P.left<=3)beep(520,90);
  const t=$("#ptm"),r=$("#rfg"),tr=$("#ptr");if(t)t.textContent=fmt(P.left);if(r)r.style.strokeDashoffset=ringOff();
  if(tr&&!P.rest){const sec=P.w.ex[P.i][1];tr.style.width=Math.round((P.i+1-P.left/sec)/P.w.ex.length*100)+"%"}}
/* ao fim de um exercício entra um descanso curto; ao fim do descanso, o próximo começa sozinho */
function advance(manual){
  const last=P.i>=P.w.ex.length-1;
  if(!P.rest&&last){clearInterval(P.int);P.run=false;beep(990,300);P.finished=true;renderP();return}
  if(!P.rest){P.rest=true;P.left=REST}else{P.rest=false;P.i++;P.left=P.w.ex[P.i][1]}
  if(!manual)beep(P.rest?660:880);
  renderP();
}
function closeP(){if(P)clearInterval(P.int);wake(false);const el=$("#player");if(el)el.remove();document.body.style.overflow="";P=null;route(true)}

function billsOf(db,list){const out=[],ms=monthsBack(6),cur=mkey(Date.now());
  list.forEach(c=>ms.forEach((m,idx)=>{const sm=mkey(c.since);if(m<sm)return;if(c.status==="pausado"&&m===cur)return;
    const ago=5-idx;let lv=c.id==="me"?c.level:Math.max(1,c.level-Math.floor(ago/2));
    if(lv===1&&m!==sm){if(c.level===1)return;lv=2}
    out.push({key:c.id+"|"+m,cid:c.id,pid:c.pid,m,lv,amount:db.prices[lv-1]})}));return out}

const lvb=n=>`<span class="lv" title="Nível ${n}: ${LEVELS[n-1].t}">${n}</span>`;
const kpi=(ic,label,val,sub)=>`<div class="kpi"><small><i data-lucide="${ic}"></i>${label}</small><b>${val}</b>${sub?`<span>${sub}</span>`:""}</div>`;
const niceMax=v=>{const p=10**Math.floor(Math.log10(v||1)),n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p};
const rtop=(x,y,w,h,r)=>{r=Math.min(r,h,w/2);return`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`};
/* barras verticais de uma série: rótulo só no último valor, o resto no toque/hover */
function vbars(data,fmt=money){const W=560,H=210,pl=52,pr=8,pt=26,pb=28,iw=W-pl-pr,ih=H-pt-pb,max=niceMax(Math.max(...data.map(d=>d.v),1)),cw=iw/data.length,bw=Math.min(46,cw*.55);
  const y=v=>pt+ih-(v/max)*ih;
  const grid=[0,.5,1].map(f=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(max*f)}" y2="${y(max*f)}"/><text class="ax" x="${pl-8}" y="${y(max*f)+4}" text-anchor="end">${fmt(max*f).replace("R$ ","")}</text>`).join("");
  const bars=data.map((d,i)=>{const x=pl+cw*i+(cw-bw)/2,h=Math.max(0,ih*d.v/max);
    return`<g data-tip="${esc(d.label)}: ${esc(fmt(d.v))}"><rect class="hit" x="${pl+cw*i}" y="${pt}" width="${cw}" height="${ih}"/>${h?`<path class="bar" d="${rtop(x,y(d.v),bw,h,4)}"/>`:""}<text class="ax" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.short||d.label)}</text>${i===data.length-1?`<text class="vl" x="${x+bw/2}" y="${y(d.v)-8}" text-anchor="middle">${esc(fmt(d.v))}</text>`:""}</g>`}).join("");
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(data.map(d=>d.label+": "+fmt(d.v)).join("; "))}">${grid}${bars}</svg></div>`}
function hbars(data){const max=Math.max(...data.map(d=>d.v),1);return`<div class="hb">${data.map(d=>`<div data-tip="${esc(d.label)}: ${d.v}"><span>${esc(d.label)}</span><i style="width:${d.v/max*100}%"></i><b>${d.v}</b></div>`).join("")}</div>`}
/* dica flutuante para gráficos */
(()=>{let tip=null;const hide=()=>{if(tip){tip.remove();tip=null}};
  const show=(el,x,y)=>{if(!tip){tip=document.createElement("div");tip.className="tip";document.body.appendChild(tip)}tip.textContent=el.dataset.tip;tip.style.left=x+"px";tip.style.top=y+"px"};
  addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");el?show(el,e.clientX,e.clientY):hide()});
  addEventListener("touchstart",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el){const r=el.getBoundingClientRect();show(el,r.left+r.width/2,r.top)}else hide()},{passive:true});
  addEventListener("scroll",hide,{passive:true});addEventListener("hashchange",hide)})();

    if(c.level===4)acts.push(["gym","dumbbell","Registrar aula na academia"]);

      <div class="sec2"><h3>Para subir de nível</h3><div class="chk">${cr.map(([t,d])=>`<div class="${d?"y":""}"><i data-lucide="${d?"circle-check":"circle-dashed"}"></i>${esc(t)}</div>`).join("")}</div><div class="prog mt"><i style="width:${pctFor(c)}%"></i></div></div>

/* muda o estado de um agendamento; skipCount evita contar duas vezes quando a ficha já contou */
function setBk(b,status,skipCount){
  if(b.cid==="me"){const x=S.bookings.find(y=>"me-"+y.ts===b.id);if(!x)return;
    if(status==="cancelado"){S.bookings=S.bookings.filter(y=>y!==x);S.messages.push({from:"them",text:`Precisei cancelar nosso horário de ${dlabel(b.ts).toLowerCase()} às ${hm(b.ts)}. Vamos remarcar? 🙏`,t:nowT()});S.unread++}
    else{x.done=true;if(!skipCount){if(b.type==="Ao ar livre")S.outdoor++;if(b.type==="Academia")S.gymsessions++}if(b.type==="Primeira conversa")S.talked=true}
    save();return}
  const x=DB.bookings.find(y=>y.id===b.id);x.status=status;
  if(status==="feito"&&!skipCount){const c=DB.clients.find(y=>y.id===b.cid);if(c){if(b.type==="Ao ar livre")c.outdoor++;if(b.type==="Academia")c.gym++;if(b.type==="Primeira conversa")c.talked=true}}
  saveDB()}

  <select id="fst" aria-label="Situação">${[["ativo","Ativos"],["pausado","Pausados"],["todos","Todos"]].map(([v,t])=>`<option value="${v}" ${PF.st===v?"selected":""}>${t}</option>`).join("")}</select>${extra}</div>`}
function bindFilters(redraw){const q=$("#fq");q.oninput=()=>{PF.q=q.value;redraw()};$("#flv").onchange=e=>{PF.lv=e.target.value;redraw()};$("#fst").onchange=e=>{PF.st=e.target.value;redraw()}}
function pAlunos(p,cs){

function bookingForm(clients){const d=new Date(Date.now()+D1);const ds=d.toISOString().slice(0,10);
  return`<form class="card" id="nbk"><div class="card-h"><h3>Marcar horário</h3></div><div class="set">
    <div class="field" style="margin:0"><label for="nbc">Aluno</label><select id="nbc" required>${clients.filter(c=>c.status==="ativo").map(c=>`<option value="${c.id}">${esc(c.name)}${c.you?" (este aparelho)":""}</option>`).join("")}</select></div>
    <div class="field" style="margin:0"><label for="nbt">Tipo</label><select id="nbt">${BTYPES.map(([t])=>`<option>${t}</option>`).join("")}</select></div>
    <div class="field" style="margin:0"><label for="nbd">Dia</label><input id="nbd" type="date" value="${ds}" required></div>
    <div class="field" style="margin:0"><label for="nbh">Horário</label><input id="nbh" type="time" value="09:00" required></div></div>
    <button class="btn btn-primary mt"><i data-lucide="calendar-plus"></i>Marcar e avisar o aluno</button></form>`}
function bindBookingForm(pid,after){$("#nbk").onsubmit=e=>{e.preventDefault();const cid=$("#nbc").value,type=$("#nbt").value,[y,mo,da]=$("#nbd").value.split("-"),[h,mi]=$("#nbh").value.split(":");
  const ts=new Date(+y,+mo-1,+da,+h,+mi).getTime(),mode=type==="Ao ar livre"?"presencial":type==="Academia"?"na academia":"online";
  if(cid==="me"){S.bookings.push({ts,time:$("#nbh").value,type,mode:mode==="online"?S.profile.contact.toLowerCase():mode,done:false})}else DB.bookings.push({id:"b"+Date.now(),cid,pid,ts,type,mode,status:"agendado"});
  pushMsg(cid,`Marquei nosso ${type.toLowerCase()} para ${dlabel(ts).toLowerCase()} às ${hm(ts)}. Se não puder, é só me avisar. 😊`);saveDB();toast("Horário marcado e aluno avisado");after()}}
function pAgenda(p,cs){
  const t0=sod(),all=bookingsAll().filter(b=>b.pid===p.id&&b.status!=="cancelado");
  const up=all.filter(b=>b.ts>=t0).sort((a,b)=>a.ts-b.ts),past=all.filter(b=>b.ts<t0).sort((a,b)=>b.ts-a.ts).slice(0,6);
  const groups={};up.forEach(b=>{const k=dlabel(b.ts);(groups[k]=groups[k]||[]).push(b)});
  const row=b=>{const c=findC(b.cid);if(!c)return"";return`<div class="rw"><span class="time">${hm(b.ts)}</span>${avatar(c)}<span><b>${esc(c.name)}</b><small>${b.type} · ${b.mode}</small></span><span class="end">${b.status==="feito"?pill("ok","check","Feito"):`<button class="btn btn-ghost btn-sm" data-bk="${b.id}" data-s="feito"><i data-lucide="check"></i>Concluir</button><button class="btn btn-ghost btn-sm" data-bk="${b.id}" data-s="cancelado" aria-label="Cancelar"><i data-lucide="x"></i></button>`}</span></div>`};
  $("#pv").innerHTML=`<div class="grid2" style="margin-top:0;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
    <section class="card"><div class="card-h"><h3>Próximos encontros</h3><span class="pill mute">${up.length}</span></div>${up.length?Object.entries(groups).map(([k,l])=>`<p style="font-weight:700;margin:10px 0 2px;text-transform:capitalize">${k}</p><div class="rows">${l.map(row).join("")}</div>`).join(""):`<p class="empty-s">Nada marcado. Use o formulário ao lado.</p>`}</section>
    <div style="display:grid;gap:14px;align-content:start">${bookingForm(cs)}<section class="card"><div class="card-h"><h3>Realizados recentemente</h3></div><div class="rows">${past.length?past.map(row).join(""):`<p class="empty-s">Nenhum ainda.</p>`}</div></section></div>
  </div>`;
  document.querySelectorAll("[data-bk]").forEach(x=>x.onclick=()=>{const b=bookingsAll().find(y=>y.id===x.dataset.bk);setBk(b,x.dataset.s);if(x.dataset.s==="cancelado"&&b.cid!=="me")pushMsg(b.cid,`Precisei cancelar nosso horário de ${dlabel(b.ts).toLowerCase()}. Vamos remarcar? 🙏`);toast(x.dataset.s==="feito"?"Encontro concluído":"Horário cancelado e aluno avisado");route(true)});
  bindBookingForm(p.id,()=>route(true));
}
const TEMPLATES=["Como você está hoje?","Lembrete: nosso horário é amanhã.","Liberei um treino novo para você.","Tudo bem pular hoje. Amanhã a gente retoma. 💛"];
function pMsgs(p,cs){
  const list=[...cs].sort((a,b)=>((lastMsg(b)||{}).at||0)-((lastMsg(a)||{}).at||0));
  if(PM.cid&&!list.some(c=>c.id===PM.cid))PM.cid=null;
  const wide=matchMedia("(min-width:901px)").matches;if(!PM.cid&&wide&&list[0])PM.cid=list[0].id;
  const c=PM.cid&&findC(PM.cid);
  $("#pv").innerHTML=`<div class="convs ${c?"open":""}">
    <div class="cl">${list.map(x=>{const lm=lastMsg(x);return`<button class="${x.id===PM.cid?"on":""}" data-cv="${x.id}">${avatar(x)}<span style="min-width:0"><b>${esc(x.name)}</b><small>${lm?(lm.from==="them"?"Você: ":"")+esc(lm.text):"Sem mensagens"}</small></span>${needsReply(x)?`<span class="dot" aria-label="Esperando resposta"></span>`:""}</button>`}).join("")}</div>
    <div class="thr">${c?`<div class="thr-h"><button class="rbtn" id="cvb" aria-label="Voltar" style="${wide?"display:none":""}"><i data-lucide="arrow-left"></i></button>${avatar(c)}<div><b>${esc(c.name)}</b><br><small style="color:var(--muted)">Nível ${c.level} · prefere ${esc(c.contact.toLowerCase())}</small></div><button class="btn btn-ghost btn-sm" data-open="${c.id}" style="margin-left:auto">Ver ficha</button></div>
      <div class="msgs" id="pmsgs">${c.msgs.map(m=>`<div class="msg ${m.from==="them"?"me":"them"}">${esc(m.text)}<time>${m.t||""}</time></div>`).join("")}</div>
      <div class="quick">${TEMPLATES.map(t=>`<button data-tq="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      <form class="composer" id="pcf"><input id="pci" placeholder="Escreva para ${esc(c.name.split(" ")[0])}" autocomplete="off" aria-label="Mensagem"><button aria-label="Enviar"><i data-lucide="send"></i></button></form>`:""}</div>
  </div>`;
  document.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{PM.cid=b.dataset.cv;route(true)});
  if(!c)return;
  const box=$("#pmsgs");box.scrollTop=box.scrollHeight;
  const cvb=$("#cvb");if(cvb)cvb.onclick=()=>{PM.cid=null;route(true)};
  const send=t=>{if(!t.trim())return;pushMsg(c.id,t.trim());route(true);
    if(!c.you)setTimeout(()=>{const x=DB.clients.find(y=>y.id===c.id);if(!x)return;x.msgs.push({from:"me",text:["Obrigado! 😊","Combinado!","Vou tentar hoje à noite.","Valeu pelo cuidado 💛"][x.msgs.length%4],t:nowT(),at:Date.now()});saveDB();if(location.hash.includes("personal/mensagens")&&!document.querySelector(".drawer"))route(true)},1800)};
  $("#pcf").onsubmit=e=>{e.preventDefault();send($("#pci").value)};
  document.querySelectorAll("[data-tq]").forEach(b=>b.onclick=()=>send(b.dataset.tq));
  if(wide)$("#pci").focus({preventScroll:true});
}

  $("#pv").innerHTML=`<div class="toolbar"><select id="fm" aria-label="Mês">${ms.map(m=>`<option value="${m}" ${m===FM?"selected":""}>${mlabel(m,1)} de ${m.slice(0,4)}</option>`).join("")}</select></div>
  <div class="kpis">${kpi("receipt","Faturado",money(sum(()=>true)),`${mb.length} mensalidades`)}${kpi("circle-check","Recebido",money(sum(b=>b.paid)),`${mb.filter(b=>b.paid).length} pagas`)}${kpi("clock","Pendente",money(sum(b=>b.status==="pendente")),"vence dia 10")}${kpi("circle-alert","Atrasado",money(sum(b=>b.status==="atrasado")),`${mb.filter(b=>b.status==="atrasado").length} clientes`)}</div>
  <section class="mt"><div class="card-h"><h3>Mensalidades</h3></div><div class="tbl"><table><thead><tr><th>Cliente</th><th>Personal</th><th>Nível</th><th class="num">Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr></thead><tbody>${mb.map(b=>{const c=findC(b.cid),p=findP(b.pid);return`<tr data-open="${b.cid}"><td><span class="nm">${avatar(c)}<b>${esc(c.name)}</b></span></td><td>${esc(p?p.name:"—")}</td><td>${lvb(b.lv)}</td><td class="num">${money(b.amount)}</td><td>10/${b.m.slice(5)}</td><td>${pill(...BILL_PILL[b.status])}</td><td data-stop style="white-space:nowrap;text-align:right">${b.paid?`<button class="btn btn-ghost btn-sm" data-pay="${b.key}" data-v="0">Desfazer</button>`:`<button class="btn btn-ghost btn-sm" data-remind="${b.cid}" aria-label="Lembrar ${esc(c.name)}"><i data-lucide="bell"></i></button> <button class="btn btn-primary btn-sm" data-pay="${b.key}" data-v="1">Marcar pago</button>`}</td></tr>`}).join("")}</tbody></table></div></section>
  <section class="mt"><div class="card-h"><h3>Repasse às personais (${DB.split}% do recebido)</h3></div><div class="tbl"><table style="min-width:520px"><thead><tr><th>Personal</th><th class="num">Mensalidades</th><th class="num">Recebido</th><th class="num">Repasse</th><th class="num">Fica com a empresa</th></tr></thead><tbody>${rep.map(x=>`<tr style="cursor:default"><td><b>${esc(x.p.name)}</b></td><td class="num">${x.n}</td><td class="num">${money(x.paid)}</td><td class="num"><b>${money(x.paid*sp)}</b></td><td class="num">${money(x.paid*(1-sp))}</td></tr>`).join("")}</tbody></table></div></section>`;
  $("#fm").onchange=e=>{FM=e.target.value;route(true)};
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{DB.paid[b.dataset.pay]=b.dataset.v==="1";saveDB();toast(b.dataset.v==="1"?"Pagamento registrado":"Pagamento desfeito");route(true)});
  document.querySelectorAll("[data-remind]").forEach(b=>b.onclick=()=>{pushMsg(b.dataset.remind,"Oi! Passando para lembrar da mensalidade deste mês. Se precisar de mais prazo, é só falar. 💛");toast("Lembrete enviado no app do cliente")});
}
let LF="novo";
function aLeads(){
  const L=DB.leads.filter(l=>LF==="todos"||l.status===LF).sort((a,b)=>b.at-a.at);
  const ST={novo:["info","sparkles","Novo"],contatado:["warn","phone","Em contato"],convertido:["ok","circle-check","Convertido"],arquivado:["mute","archive","Arquivado"]};
  $("#pv").innerHTML=`<div class="filters" role="group" aria-label="Filtrar contatos">${[["novo","Novos"],["contatado","Em contato"],["convertido","Convertidos"],["todos","Todos"]].map(([k,t])=>`<button aria-pressed="${LF===k}" data-lf="${k}">${t} (${k==="todos"?DB.leads.length:DB.leads.filter(l=>l.status===k).length})</button>`).join("")}</div>
  <div class="pgrid">${L.length?L.map(l=>`<article class="lead"><div class="top">${pill(...ST[l.status])}${pill(l.type==="personal"?"warn":"mute",l.type==="personal"?"dumbbell":"user-round",l.type==="personal"?"Quer ser personal":"Quer começar")}<small style="margin-left:auto">${rel(l.at)}</small></div>
    <b style="font-size:17px">${esc(l.name)}</b><small>${esc(l.contact)}${l.cref?" · "+esc(l.cref):""}${l.area?" · "+esc(l.area):""}</small><p>“${esc(l.msg)}”</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${l.status==="novo"?`<button class="btn btn-ghost btn-sm" data-ls="${l.id}" data-v="contatado"><i data-lucide="phone"></i>Marcar em contato</button>`:""}${l.status!=="convertido"&&l.status!=="arquivado"?`<button class="btn btn-primary btn-sm" data-conv="${l.id}"><i data-lucide="${l.type==="personal"?"badge-check":"user-plus"}"></i>${l.type==="personal"?"Enviar para análise":"Virar cliente"}</button><button class="btn btn-ghost btn-sm" data-ls="${l.id}" data-v="arquivado" aria-label="Arquivar"><i data-lucide="archive"></i></button>`:""}</div></article>`).join(""):`<div class="empty">Nenhum contato aqui.</div>`}</div>
  <div class="info mt"><i data-lucide="info"></i><span>Os contatos chegam pelos formulários do site (“Fale com a gente” e “Seja personal parceiro”).</span></div>`;
  document.querySelectorAll("[data-lf]").forEach(b=>b.onclick=()=>{LF=b.dataset.lf;route(true)});
  document.querySelectorAll("[data-ls]").forEach(b=>b.onclick=()=>{DB.leads.find(l=>l.id===b.dataset.ls).status=b.dataset.v;saveDB();toast(b.dataset.v==="arquivado"?"Arquivado":"Marcado como em contato");route(true)});
  document.querySelectorAll("[data-conv]").forEach(b=>b.onclick=()=>{const l=DB.leads.find(x=>x.id===b.dataset.conv);l.status="convertido";
    if(l.type==="personal"){DB.personals.push({id:"p"+Date.now(),name:l.name,cref:l.cref||"CREF a confirmar",area:l.area||"A definir",bio:l.msg,spec:["A definir"],status:"pendente",cap:15,rating:null,since:Date.now()});toast("Enviado para análise em Personais")}
    else{const pid=DB.personals.find(p=>p.status==="ativo").id;DB.clients.push({id:"c"+Date.now(),name:l.name,level:1,pid,since:Date.now(),goals:["Me sentir melhor comigo"],barriers:["Não sei por onde começar"],contact:"Só mensagem",period:"Noite",days:["Seg","Qua"],medical:false,medOk:false,workouts:[],talked:false,outdoor:0,gym:0,status:"ativo",msgs:[{from:"me",text:l.msg,t:"",at:l.at}],phone:l.contact});toast("Cliente criado no nível 1")}
    saveDB();route(true)});
}
function aAjustes(){
  $("#pv").innerHTML=`<form class="card" id="pr" style="max-width:760px"><div class="card-h"><h3>Preços por nível</h3></div><p style="color:var(--muted);margin-bottom:14px">Os valores aparecem no site, no app do cliente e nas cobranças do mês.</p>
    <div class="set">${LEVELS.map((l,i)=>`<div class="field" style="margin:0"><label for="pr${i}">Nível ${l.n} · ${l.t}</label><input id="pr${i}" type="number" min="0" step="1" value="${DB.prices[i]}" inputmode="numeric"><small style="color:var(--muted)">${i===0?"pagamento único":"por mês"}</small></div>`).join("")}</div>
    <div class="field mt" style="max-width:260px"><label for="spl">Repasse para a personal (%)</label><input id="spl" type="number" min="0" max="100" value="${DB.split}"></div>
    <button class="btn btn-primary"><i data-lucide="save"></i>Salvar preços</button></form>
  <section class="card mt" style="max-width:760px"><div class="card-h"><h3>Dados de demonstração</h3></div><p style="color:var(--muted)">Volta os clientes, personais, agenda, pagamentos e contatos de exemplo ao estado inicial. O app do cliente deste aparelho não é apagado.</p><button class="btn btn-ghost mt" id="rs" style="color:var(--red)"><i data-lucide="rotate-ccw"></i>Restaurar dados de exemplo</button></section>
  <div class="info mt" style="max-width:760px"><i data-lucide="server"></i><span><b style="color:var(--ink)">Para usar com clientes reais</b>, este site precisa de um servidor com login, banco de dados e pagamento online (por exemplo Pix). Hoje tudo fica salvo só no navegador de quem usa.</span></div>`;
  $("#pr").onsubmit=e=>{e.preventDefault();DB.prices=LEVELS.map((_,i)=>Math.max(0,Math.round(+$("#pr"+i).value||0)));DB.split=Math.min(100,Math.max(0,+$("#spl").value||0));saveDB();syncPrices();toast("Preços salvos. O site já mostra os novos valores.");route(true)};
  $("#rs").onclick=()=>sheet("rotate-ccw","Restaurar dados de exemplo?","Todas as alterações feitas nos painéis serão perdidas.","Restaurar",{danger:true,cancel:"Cancelar",onOk:()=>{DB=seedDB();saveDB();syncPrices();toast("Dados de exemplo restaurados");route(true)}});
}

/* formulários do site → contatos da empresa */
function bindSiteForms(){
  const f1=$("#fc");if(f1)f1.onsubmit=e=>{e.preventDefault();DB.leads.push({id:"l"+Date.now(),type:"cliente",name:$("#fcn").value.trim(),contact:$("#fcc").value.trim(),msg:$("#fcm").value.trim()||"Quero saber mais.",at:Date.now(),status:"novo"});saveDB();f1.reset();toast("Mensagem enviada! Vamos responder em até 1 dia útil.")};
  const f2=$("#fp");if(f2)f2.onsubmit=e=>{e.preventDefault();DB.leads.push({id:"l"+Date.now(),type:"personal",name:$("#fpn").value.trim(),contact:$("#fpc").value.trim(),cref:"CREF "+$("#fpr").value.trim(),area:$("#fpa").value.trim(),msg:"Quero ser personal parceiro.",at:Date.now(),status:"novo"});saveDB();f2.reset();toast("Cadastro recebido! Vamos analisar seu CREF e entrar em contato.")};
}

applyTheme();
route();
</script>

</body>
</html>
