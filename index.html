/* ================== FINANCEIRO ==================
   Cada mensalidade paga se divide em: parte da personal (% dela), taxa de pagamento e o que fica com a empresa. */
const splitOf=pid=>{const p=findP(pid);return((p&&p.split!=null?p.split:DB.split))/100};
/* taxa média ponderada pelas formas usadas nas mensalidades pagas */
const feeOf=()=>{const pb=bills().filter(b=>b.paid);return pb.length?pb.reduce((s,b)=>s+feeFor(b),0)/pb.length:(DB.fees?DB.fees.pix:0.99)/100};
const pctf=v=>(Math.round(v*1000)/10).toLocaleString("pt-BR")+"%";
function fin(list){const r={fat:0,rec:0,open:0,late:0,rep:0,tax:0,emp:0,n:list.length,paidN:0};
  list.forEach(b=>{r.fat+=b.amount;if(b.paid){r.paidN++;r.rec+=b.amount;const rp=b.amount*splitOf(b.pid),tx=b.amount*feeFor(b);r.rep+=rp;r.tax+=tx;r.emp+=b.amount-rp-tx}else{r.open+=b.amount;if(b.status==="atrasado")r.late+=b.amount}});
  r.margin=r.rec?r.emp/r.rec:0;return r}
const payoutKey=(pid,m)=>pid+"|"+m;
/* repasses dos meses já fechados vêm marcados como pagos nos dados de exemplo */
function seedFin(db){db.payouts={};monthsBack(6).slice(0,4).forEach(m=>db.personals.forEach(p=>{if(p.status==="ativo")db.payouts[p.id+"|"+m]=new Date(m+"-05T12:00").getTime()+30*D1}));db.personals.forEach(p=>{if(p.split==null)p.split=p.id==="p1"?70:65});return db}
if(!DB.payouts){seedFin(DB);saveDB()}

/* barras empilhadas de duas séries, com legenda e total no último mês */
function sbars(data,names,fmt=money){const W=560,H=230,pl=52,pr=8,pt=30,pb=28,iw=W-pl-pr,ih=H-pt-pb,max=niceMax(Math.max(...data.map(d=>d.a+d.b),1)),cw=iw/data.length,bw=Math.min(46,cw*.55),y=v=>pt+ih-(v/max)*ih;
  const grid=[0,.5,1].map(f=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(max*f)}" y2="${y(max*f)}"/><text class="ax" x="${pl-8}" y="${y(max*f)+4}" text-anchor="end">${fmt(max*f).replace("R$ ","")}</text>`).join("");
  const bars=data.map((d,i)=>{const x=pl+cw*i+(cw-bw)/2,ha=ih*d.a/max,hb=ih*d.b/max,gap=d.a&&d.b?2:0,top=y(d.a+d.b);
    return`<g><rect class="hit" x="${pl+cw*i}" y="${pt}" width="${cw}" height="${ih}" data-tip="${esc(d.label)}: ${esc(fmt(d.a+d.b))}"/>${ha?`<rect class="s1" x="${x}" y="${y(d.a)}" width="${bw}" height="${ha}" data-tip="${esc(d.label)} · ${names[0]}: ${esc(fmt(d.a))}"/>`:""}${hb?`<path class="s2" d="${rtop(x,top,bw,Math.max(0,hb-gap),4)}" data-tip="${esc(d.label)} · ${names[1]}: ${esc(fmt(d.b))}"/>`:""}<text class="ax" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.short)}</text>${i===data.length-1?`<text class="vl" x="${x+bw/2}" y="${top-8}" text-anchor="middle">${esc(fmt(d.a+d.b))}</text>`:""}</g>`}).join("");
  return`<div class="legend"><span><i class="k1"></i>${names[0]}</span><span><i class="k2"></i>${names[1]}</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(data.map(d=>`${d.label}: ${names[0]} ${fmt(d.a)}, ${names[1]} ${fmt(d.b)}`).join("; "))}">${grid}${bars}</svg></div>`}
/* barra única de 100% mostrando como um valor se divide */
function splitBar(parts){const tot=parts.reduce((s,p)=>s+p.v,0)||1;
  return`<div class="split-bar" role="img" aria-label="${esc(parts.map(p=>`${p.label} ${pctf(p.v/tot)}`).join(", "))}">${parts.filter(p=>p.v>0).map(p=>`<i class="${p.k}" style="flex:${p.v}" data-tip="${esc(p.label)}: ${esc(money(p.v))} (${pctf(p.v/tot)})"></i>`).join("")}</div>
  <div class="split-leg">${parts.map(p=>`<div><span><i class="${p.k}"></i>${esc(p.label)}</span><b>${money(p.v)}</b><small>${pctf(p.v/tot)}</small></div>`).join("")}</div>`}
async function copyText(t,okMsg){try{await navigator.clipboard.writeText(t);toast(okMsg)}catch(e){const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(okMsg)}catch(_){toast("Não foi possível copiar neste navegador")}ta.remove()}}

/* ---------- personal: ganhos ---------- */
function pGanhos(p){
  const bl=bills().filter(b=>b.pid===p.id),ms=monthsBack(6),cur=mkey(Date.now()),prev=ms[4],sp=splitOf(p.id);
  const now=fin(bl.filter(b=>b.m===cur)),mine=bl.filter(b=>b.m===cur);

/* desenho de QR apenas ilustrativo (não é um código Pix válido) */
function fakeQR(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const n=25,cells=[];const rnd=()=>(h=(h*1103515245+12345)>>>0)/4294967296;
  const finder=(x,y)=>[[x,y,7,7,1],[x+1,y+1,5,5,0],[x+2,y+2,3,3,1]];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!inF&&rnd()<.5)cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`)}
  const f=[...finder(0,0),...finder(n-7,0),...finder(0,n-7)].map(([x,y,w,hh,on])=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${on?"#1E2733":"#fff"}"/>`).join("");
  return`<svg viewBox="-2 -2 ${n+4} ${n+4}"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><g fill="#1E2733">${cells.join("")}</g>${f}</svg>`}

   Período (mensal, trimestral, semestral) dá desconto; nos níveis presenciais escolhe-se aulas por semana;

let PL={per:3,freq:{3:2,4:2},q:{},shown:{}};
const PERIODS=[[1,"Mensal"],[3,"Trimestral"],[6,"Semestral"]];
const discOf=per=>((DB.disc||{1:0,3:10,6:15})[per]||0)/100;
function planPrice(i){const base=DB.prices[i];if(i===0)return{m:base,full:base,once:true};
  const fr=i>=2?PL.freq[i+1]:null,full=i>=2?base/8*fr*4:base,d=discOf(PL.per);return{m:full*(1-d),full,fr,per:PL.per,total:full*(1-d)*PL.per,save:full*d*PL.per}}

      <a class="btn ${isRec||star?"btn-primary":"btn-ghost"} btn-sm pl-cta" href="#/comecar" data-plan="${l.n}">Começar<span class="dm">&nbsp;${i===0?"agora":"neste nível"}</span></a></article>`}).join("")}</div>

const FSEGS=[["n","p"],["n","el"],["el","hl"],["n","er"],["er","hr"],["p","kl"],["kl","fl"],["p","kr"],["kr","fr"]];
const figSeq=ex=>ex.poses.length>2?[...ex.poses,ex.poses[0]]:[ex.poses[0],ex.poses[1],ex.poses[0]];
function fig(ex,cls="",speed=1){const P=ex.poses[0];
  const props={chair:`<path class="prop" d="M30 92H60M32 92V127M58 92V127M30 92V58"/>`,wall:`<path class="prop" d="M106 20V127"/>`,wallL:`<path class="prop" d="M16 20V127"/>`,mat:`<path class="prop" d="M6 129H112" stroke-width="4"/>`}[ex.prop]||"";
  return`<svg class="fig ${cls}" data-ex="${ex.id}" data-speed="${speed}" viewBox="0 0 120 136" role="img" aria-label="Demonstração animada: ${esc(ex.n)}"><line class="ground" x1="4" y1="130" x2="116" y2="130"/>${props}
    ${FSEGS.map(([a,b])=>`<line class="limb" data-s="${a} ${b}" x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}"/>`).join("")}${ex.prop==="band"?`<line class="band" data-s="hl hr" x1="${P.hl[0]}" y1="${P.hl[1]}" x2="${P.hr[0]}" y2="${P.hr[1]}"/>`:""}
    <circle class="head" cx="${P.h[0]}" cy="${P.h[1]}" r="9"/></svg>`}
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function figTick(now){
  document.querySelectorAll("svg.fig[data-ex]").forEach(sv=>{if(sv.dataset.paused==="1")return;
    const ex=exById(sv.dataset.ex);if(!ex)return;if(sv._t0==null)sv._t0=now;
    const seq=figSeq(ex),n=seq.length-1,D=ex.dur*(+sv.dataset.speed||1)*1000,f=((Math.max(0,now-sv._t0)%D)/D)*n,i=Math.max(0,Math.min(n-1,Math.floor(f))),t=easeIO(f-i),A=seq[i],B=seq[i+1];
    sv._seg=i;const pt=k=>[A[k][0]+(B[k][0]-A[k][0])*t,A[k][1]+(B[k][1]-A[k][1])*t];
    sv.querySelectorAll("line[data-s]").forEach(l=>{const[a,b]=l.dataset.s.split(" "),p1=pt(a),p2=pt(b);l.setAttribute("x1",p1[0].toFixed(1));l.setAttribute("y1",p1[1].toFixed(1));l.setAttribute("x2",p2[0].toFixed(1));l.setAttribute("y2",p2[1].toFixed(1))});
    const h=pt("h"),c=sv.querySelector(".head");c.setAttribute("cx",h[0].toFixed(1));c.setAttribute("cy",h[1].toFixed(1))});
  requestAnimationFrame(figTick)}

  keep(text);
}
function seedTerms(db){db.flags=[{id:"f0",from:"personal",cid:"c4",pid:"p2",cname:"Carlos Eduardo Santos",pname:"Rafael Nunes",text:"Se quiser, me chama no zap que faço um valor melhor por fora.",at:Date.now()-3*D1,status:"aberto"}];db.personals.forEach(p=>{if(p.status==="ativo"&&!p.terms)p.terms={v:"1.0",at:p.since+2*D1}});return db}
if(!DB.flags){seedTerms(DB);saveDB()}

/* formulários do site → contatos da empresa */
function bindSiteForms(){
  const f1=$("#fc");if(f1)f1.onsubmit=e=>{e.preventDefault();DB.leads.push({id:"l"+Date.now(),type:"cliente",name:$("#fcn").value.trim(),contact:$("#fcc").value.trim(),msg:$("#fcm").value.trim()||"Quero saber mais.",at:Date.now(),status:"novo"});saveDB();f1.reset();toast("Mensagem enviada! Vamos responder em até 1 dia útil.")};
  const f2=$("#fp");if(f2)f2.onsubmit=e=>{e.preventDefault();DB.leads.push({id:"l"+Date.now(),type:"personal",name:$("#fpn").value.trim(),contact:$("#fpc").value.trim(),cref:"CREF "+$("#fpr").value.trim(),area:$("#fpa").value.trim(),msg:"Quero ser personal parceiro.",at:Date.now(),status:"novo"});saveDB();f2.reset();toast("Cadastro recebido! Vamos analisar seu CREF e entrar em contato.")};
}
